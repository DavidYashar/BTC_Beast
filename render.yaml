services:
  - type: web
    name: utxo-beast
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build && npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: utxo-beast-db
          property: connectionString
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: TWITTER_USERNAME
        value: beast_btc15135
      - key: OPENAI_API_KEY
        sync: false
      - key: UTXO_API_BASE_URL
        value: https://utxo.fun/api/agent
      - key: SPARK_AGENT_NETWORK
        value: MAINNET
      - key: OPERATOR_SECRET
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: TRENDING_CRON
        value: "0 */4 * * *"
      - key: MENTIONS_CRON
        value: "*/5 * * * *"
      - key: ENGAGEMENT_CRON
        value: "*/15 * * * *"
      - key: SELF_PROMO_CRON
        value: "0 14 * * *"
      - key: S402_CRON
        value: "0 18 * * *"
      - key: WALLET_CRON
        value: "0 22 * * *"
      - key: CONTENT_CRON
        value: "0 */3 * * *"
      - key: AUTO_TWEET
        value: "false"

databases:
  - name: utxo-beast-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
